# Lightning-LM simulation config, derived from upstream config/m20_pro.yaml (pinned SHA in .gitmodules).
# Changes vs upstream (plan T18 + simulation interface, reasons inline):
common:
  sensor_qos: best_effort
  lidar_topic: /points_lio          # cloud_adapter output (VELO32 fields)
  livox_lidar_topic: /livox/lidar_unused
  imu_topic: /imu                   # follower IMU at mid360_frame, 200 Hz
fasterlio:
  lidar_type: 2                     # VELO32: x,y,z,intensity,time,ring PointCloud2
  scan_line: 50                     # > max ring index of the 400x50 gpu_lidar grid
  blind: 0.5
  time_scale: 1e-3
  skip_lidar_num: 0
  point_filter_num: 2               # 20k pts/frame sim cloud is sparser than RoboSense 32-line
  max_iteration: 4
  filter_size_scan: 0.5
  filter_size_map: 0.5
  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  imu_filter: true
  motion_model: inertial
  kf_dis_th: 2.0
  kf_angle_th: 15.0
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_T: [0.0, 0.0, 0.0]      # IMU is synthesised at mid360_frame (colocated, aligned)
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  keep_first_imu_estimation: false
g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.5
  max_th_floor: 1.0
  grid_map_resolution: 0.2
system:
  with_loop_closing: true           # plan D6
  with_ui: false                    # plan T18: headless
  with_2dui: false
  with_g2p5: false
  step_on_kf: false
  map_path: ./data/new_map/
  pub_tf: true
loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 20
  max_range: 60.0
  ndt_score_th: 0.6
  with_height: false                # plan D6: stairs forbid the height prior
  optimize_on_every_keyframe: true
lidar_loc:
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  max_frequency: 5.0
  loc_on_kf: false
  try_self_extrap: true
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: false
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: false
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
