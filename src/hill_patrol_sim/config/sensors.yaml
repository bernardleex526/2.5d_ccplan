# T14 simulation profile; user delegated model / mount / noise selection on 2026-10-13.
# Regenerate with python3 -m hill_patrol_sim.generate_model --config config/sensors.yaml --output models/m20_proxy/model.sdf
# base_link is the standing-envelope box centre. This is an abstract collision proxy,
# not CAD, leg dynamics, real extrinsics, RTK state, or calibrated hardware noise.
# Native world requirements: Fortress Sensors(ogre2), NavSat, Physics, UserCommands,
# and explicit spherical_coordinates. T16 owns persistent world/ROS bridge wiring.
# Livox grid replaces non-repetitive scanning; ideal pinhole replaces stereo disparity.
# D400 rev019 Table3-49 nominal HD87x58; square-pixel 1280x720 pinhole yields
# VFOV=2*atan(tan(87deg/2)*720/1280) (~56.74deg), not exact factory calibration.
body:
  size:
    value: [0.82, 0.43, 0.57]
    source: 'https://www.deeprobotics.cn/en/index/lynx.html Standing Dimensions 820x430x570mm; T14 collision envelope'
  mass:
    value: 35.0
    source: 'https://www.deeprobotics.cn/en/index/lynx.html Weight Incl Battery 35kg; lumped proxy includes sensors, no duplicated mass'
mid360:
  mount:
    value: [0.25, 0.0, 0.39, 0.0, 0.0, 0.0]
    source: 'SIMULATION CHOICE user delegation 2026-10-13: roof-mounted horizontal; .105m above roof clears -7deg ray over .66m to rear'
  update_rate:
    value: 10.0
    source: 'https://www.livoxtech.com/mid-360s/specs typical frame rate 10Hz'
  horizontal_deg:
    value: [-180.0, 180.0]
    source: 'https://www.livoxtech.com/mid-360s/specs horizontal360deg; SIMULATION CHOICE centred angles'
  vertical_deg:
    value: [-7.0, 52.0]
    source: 'https://www.livoxtech.com/mid-360s/specs typical vertical-7..52deg'
  samples:
    value: [400, 50]
    source: 'SIMULATION CHOICE T14: 400x50 uniform rays, 200000points/s from https://www.livoxtech.com/mid-360s/specs divided by10Hz; not Livox non-repetitive pattern'
  range:
    value: [0.1, 40.0]
    source: 'https://www.livoxtech.com/mid-360s/specs blind0.1m; typical40m at10percent reflectivity, not100m cut-off; simulation ignores reflectivity'
  range_resolution:
    value: 0.001
    source: 'SIMULATION CHOICE user delegation 2026-10-13: 1mm SDF range resolution, not manufacturer precision'
  noise_mean:
    value: 0.0
    source: 'SIMULATION CHOICE user delegation 2026-10-13: unbiased independent Gaussian range noise in metres'
  noise_stddev:
    value: 0.02
    source: 'SIMULATION APPROXIMATION https://www.livoxtech.com/mid-360s/specs <=2cm1sigma at10m25C80percent reflectivity; constant Gaussian .02m not validated over entire range'
d435i:
  mount:
    value: [0.46, 0.0, 0.15, 0.0, 0.2617993877991494, 0.0]
    source: 'SIMULATION CHOICE user delegation 2026-10-13: front sensor origin .05m outside box, pitch15deg downward; no real extrinsic calibration'
  horizontal_fov_deg:
    value: 87.0
    source: 'https://realsenseai.com/wp-content/uploads/2024/10/Intel-RealSense-D400-Series-Datasheet-October-2024.pdf Table3-49 HD depth87x58deg; ideal square-pixel projection'
  image_size:
    value: [1280, 720]
    source: 'https://realsenseai.com/wp-content/uploads/2024/10/Intel-RealSense-D400-Series-Datasheet-October-2024.pdf Table4-2 supported1280x720; SIMULATION CHOICE HD profile'
  update_rate:
    value: 15.0
    source: 'https://realsenseai.com/wp-content/uploads/2024/10/Intel-RealSense-D400-Series-Datasheet-October-2024.pdf Table4-2 supported15Hz1280x720; SIMULATION CHOICE'
  clip:
    value: [0.28, 3.0]
    source: 'https://realsenseai.com/wp-content/uploads/2024/10/Intel-RealSense-D400-Series-Datasheet-October-2024.pdf Table4-11 minZ280mm at1280x720; https://realsenseai.com/products/depth-camera-d435i/ ideal range0.3..3m; SIMULATION CHOICE farclip3m, not maximum hardware range'
  noise_mean:
    value: 0.0
    source: 'SIMULATION CHOICE user delegation 2026-10-13: unbiased Gaussian depth rendering noise'
  noise_stddev:
    value: 0.01
    source: 'SIMULATION CHOICE user delegation 2026-10-13: .01 Gaussian shader setting; not vendor accuracy. Datasheet Table4-12 specifies +/-2percent Z accuracy <=2m80percentROI HD; native shader behavior must be measured'
gnss:
  mount:
    value: [-0.2, 0.0, 0.36, 0.0, 0.0, 0.0]
    source: 'SIMULATION CHOICE user delegation 2026-10-13: rear roof antenna origin .075m above envelope, no specific receiver or antenna hardware'
  update_rate:
    value: 5.0
    source: 'SIMULATION CHOICE user delegation 2026-10-13:5Hz independent NavSat; contextual https://content.u-blox.com/sites/default/files/MAX-M10S_DataSheet_UBX-20035208.pdf Tables1-3 rates depend on constellations; no MAX-M10S/RTK equivalence claim'
  horizontal_noise_stddev_deg:
    value: 0.0000002
    source: 'SIMULATION CHOICE user delegation 2026-10-13: angular Gaussian2e-7deg; Fortress sensors6.9 NavSat applies horizontal noise to latitude/longitude degrees despite SDF metres schema: https://github.com/gazebosim/gz-sensors/blob/ignition-sensors6_6.9.0/src/NavSatSensor.cc ; ~2cm at midlatitudes, no uniformENU guarantee'
  vertical_noise_stddev:
    value: 0.03
    source: 'SIMULATION CHOICE user delegation 2026-10-13: independent altitude Gaussian .03m, not measured/RTK claim'
  velocity_noise_stddev:
    value: 0.05
    source: 'SIMULATION CHOICE user delegation 2026-10-13: independent velocity Gaussian .05m/s; contextual u-blox MAX-M10S Table1 velocity accuracy .05m/s at stated conditions is not a Gaussian sigma'
  noise_mean:
    value: 0.0
    source: 'SIMULATION CHOICE user delegation 2026-10-13: zero mean in native horizontal degrees / vertical metres / velocity m/s'
