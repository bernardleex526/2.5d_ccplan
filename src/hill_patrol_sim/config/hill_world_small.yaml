  source: "起伏最大值：实验设计值（低于国标最低台阶 0.1 m）"

summit_seed:
  value: 42
  source: "随机种子：实验设计值"

# 树木参数
trees_seed:
  value: 2026
  source: "随机种子：实验设计值"

trees_radius:
  value: 0.2
  source: "圆柱半径：实验设计值"

