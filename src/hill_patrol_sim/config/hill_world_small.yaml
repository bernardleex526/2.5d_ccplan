# 仿真山体实验设计值 — 缩小场景（第 5.3 节）
# 每个配置项均必须包含 value 与 source 字段

world_name:
  value: hill_world_small
  source: "实验设计值"

# 台阶参数
step_count_up:
  value: 18
  source: "实验设计值（上下各 1 段 18 级）"

step_count_down:
  value: 18
  source: "实验设计值（上下各 1 段 18 级）"

step_height:
  value: 0.15
  source: "用户提供；符合 GB 50352-2019 6.7.1"

tread_depth:
  value: 0.30
  source: "GB 50352-2019 6.7.1 下限"

flight_max_steps:
  value: 18
  source: "GB 50352-2019 6.8.5 上限"

flight_steps_up:
  value: [18]
  source: "实验设计值（1 段 18 级）"

flight_steps_down:
  value: [18]
  source: "实验设计值（1 段 18 级）"

intermediate_landing_depth:
  value: 1.2
  source: "GB 50352-2019 6.8.4；大于 M20 站立长度 0.82 m"

step_width:
  value: 1.5
  source: "国家登山健身步道标准主路面上限"

# 坡道参数
ramp_slope_deg:
  value: 15.0
  source: "坡度：登山步道标准“15 度左右为宜”"

ramp_length:
  value: 5.0
  source: "缩小场景坡道长度：实验设计值"

# 山顶不平路段参数
summit_length:
  value: 5.0
  source: "缩小场景山顶路段长度：实验设计值"

summit_roughness_max:
  value: 0.10
  source: "起伏最大值：实验设计值（低于国标最低台阶 0.1 m）"

summit_seed:
  value: 42
  source: "随机种子：实验设计值"

# 树木参数
trees_seed:
  value: 2026
  source: "随机种子：实验设计值"

trees_radius:
  value: 0.2
  source: "圆柱半径：实验设计值"

trees_height:
  value: 4.0
  source: "圆柱高度：实验设计值"

trees_spacing_min:
  value: 4.0
  source: "树木最小间距：实验设计值"

trees_spacing_max:
  value: 8.0
  source: "树木最大间距：实验设计值"

trees_offset_y:
  value: 1.5
  source: "路侧横向偏移：实验设计值"

# 台阶区定义
stair_zones_count:
  value: 2
  source: "实验设计值（上山 1、下山 1）"

# GNSS 原点
origin_latitude:
  value: 30.0
  source: "实验设计值（第 5.3 节与任务 T24）"

origin_longitude:
  value: 120.0
  source: "实验设计值（第 5.3 节与任务 T24）"

origin_altitude:
  value: 0.0
  source: "实验设计值（第 5.3 节与任务 T24）"

# 山体与路线几何（review 修复 2026-10-18 新增；实验设计值（AI 提议），待用户确认）
end_pad_length:
  value: 3.0
  source: "实验设计值：起终点平地长度（原生成器内常量，移入配置）"

turn_offset:
  value: 2.0
  source: "实验设计值：环线在山体两端外侧转弯的纵向距离（原生成器内常量，移入配置）"

path_shoulder_width:
  value: 2.0
  source: "实验设计值：步道两侧路肩宽度；路侧树木位于路肩内"

hillside_slope_deg:
  value: 30.0
  source: "实验设计值：山体侧坡坡度"

hillside_undulation_amplitude:
  value: 0.5
  source: "实验设计值：山坡低频起伏幅值（为雷达提供特征）"

hillside_undulation_wavelength:
  value: [8.0, 30.0]
  source: "实验设计值：山坡起伏波长范围（米）"

hillside_tree_density:
  value: 0.5
  source: "实验设计值：山坡树木密度（棵/100 m²）"

return_lane_margin:
  value: 5.0
  source: "实验设计值：坡脚到山脚回程道的横向距离"

summit_roughness_wavelength:
  value: 1.0
  source: "实验设计值：山顶起伏最小波长（米），避免逐像素高度突变"

stair_zone_margin:
  value: 1.0
  source: "实验设计值：台阶区向外扩展距离 ≥ M20 半机身长 0.41 m + 制动余量"
