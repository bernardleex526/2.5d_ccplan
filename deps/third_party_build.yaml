# Third-party build notes (hand-maintained; deps/versions.yaml is generated by check_env.py).
# Verified on WSL2 Ubuntu 22.04 + ROS 2 Humble + Gazebo Fortress 6.18 + RTX 4060, 2026-10-19.
lightning-lm-deep-robotics:
  pin: 907ecebf118fbaed0ca7765822f9dfff1a13fd80
  packages: [lightning, livox_ros_driver2 (bundled, messages only)]
  build: >-
    scripts/install_dep.sh (apt), bundled Pangolin-0.9.3 built to a private prefix,
    then colcon with CMAKE_PREFIX_PATH including that prefix; Pangolin is REQUIRED
    (no CMake switch to drop the UI), its lib dir must be on LD_LIBRARY_PATH at runtime.
  gotchas:
    - CMAKE_RUNTIME_OUTPUT_DIRECTORY is <source>/bin; that directory must exist.
    - Build with PYTHONNOUSERSITE=1 if ~/.local has a newer setuptools (livox egg version '').
    - Shell scripts need LF endings (Windows checkouts).
  runtime:
    config: src/hill_patrol_bringup/config/lightning_sim.yaml (from config/m20_pro.yaml)
    input: /points_lio (VELO32 fields via hill_patrol_sim cloud_adapter), /imu
    mapping: run_slam_online --map_name; save with /lightning/save_map (map written to ./data/<id>/ of cwd)
    localization: run_loc_online --map_path; publishes map->base_link of the lidar/IMU body
  aarch64_available: 待确认 (no CUDA; Pangolin needs OpenGL/EGL on Jetson)
elevation_mapping_cupy:
  pin: e311bfdbcd1f8ddb698b9295a7116e25475581ac (v2.0.0)
  packages: [elevation_mapping_cupy, elevation_map_msgs, semantic_sensor]
  skipped: plane_segmentation/* (COLCON_IGNORE)
  patches: [deps/patches/elevation_mapping_cupy-get_position.patch]
  python: cupy-cuda12x 13.6 + nvidia-cuda-nvrtc-cu12 (pip), torch 2.5.1+cu121, simple-parsing,
    python3-shapely, python3-ruamel.yaml, numpy<2
  gotchas:
    - Only one pointcloud subscriber works (second one aborts on a duplicate
      point_cloud_transport parameter); hill_patrol_sim cloud_merger feeds a merged cloud.
    - Without a CUDA toolkit, cupy needs the pip nvidia-*-cu12 lib dirs on LD_LIBRARY_PATH.
  aarch64_available: 待确认 (cupy/torch wheels for JetPack 6 must be matched at stage 2)
nav2_gridmap_traversability_layer:
  pin: 7c1d538a716fdbc69a84822c71544378471b2a49
  humble: builds and loads unmodified (plan T26 passed; T26b not needed)
  aarch64_available: 待确认
simulation_environment:
  gazebo_rendering_wsl2: Mesa llvmpipe (LIBGL_ALWAYS_SOFTWARE=1); D3D12 GL 4.2 is below Ogre2's need
  dds_wsl2: rmw_cyclonedds_cpp (Fast DDS discovered peers but delivered no samples on this WSL2)
